# blank_issues_enabled: false routes everyone through a form. The cost is that a
# report which fits neither form has nowhere to go, which is why Discussions is
# linked below as the catch-all -- without it this setting just loses reports.
#
# MAINTAINER SETUP: the two links below are not live until the matching features
# are switched on in repository settings --
#   * Discussions:  Settings -> General -> Features -> Discussions
#   * Report a vulnerability:  Settings -> Code security -> Private vulnerability reporting
# A contact_link that 404s is worse than no link, so turn them on or delete the entry.
blank_issues_enabled: false
contact_links:
  - name: 🔒 Report a security vulnerability
    url: https://github.com/ajay99511/FastBeat/security/advisories/new
    about: Never report a vulnerability in a public issue. Use a private advisory — see SECURITY.md.
  - name: 💬 Question, idea or general discussion
    url: https://github.com/ajay99511/FastBeat/discussions
    about: Not sure it is a bug? Want to ask how something works? Start here instead.
  - name: 📖 Setup and build problems
    url: https://github.com/ajay99511/FastBeat/blob/master/docs/GETTING_STARTED.md
    about: Gradle, SDK or emulator trouble is usually answered in the Getting Started guide.

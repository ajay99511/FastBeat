# CodeWiki Documentation Sync
#
# Generates documentation from code changes via the Gemini API.
#
# DORMANT ON PURPOSE -- manual trigger only. `google/codewiki-sync-action@v1` is a
# PLACEHOLDER that does not exist yet, so any automatic run of this workflow fails
# at that step. It previously triggered on pushes to `main`, a branch this repo does
# not have, which is the only reason the breakage was never visible. Correcting the
# branch name to `master` alone would have turned a dormant file into a red X on
# every single merge.
#
# TO ENABLE, all three:
#   1. Replace the placeholder with the real action once the preview goes GA.
#   2. Replace "your-google-cloud-project-id" with the actual project ID.
#   3. Add GEMINI_API_KEY to the repository secrets.
# ...then restore the automatic trigger:
#   on:
#     push:
#       branches: [master]   # master, not main -- FastBeat's default branch
name: CodeWiki Documentation Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codewiki-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Important: Fetch all history for diff generation

      - name: CodeWiki Sync Action
        # Assuming the use of the standard CodeWiki CLI or provided action.
        # (Replace with the exact official action repo when the preview goes GA)
        uses: google/codewiki-sync-action@v1 # Placeholder for the official action
        with:
          project_id: "your-google-cloud-project-id" # TODO: Configure this
          config_path: "codewiki.yaml"
        env:
          # This requires generating a Gemini API key from AI Studio
          # and adding it to your GitHub Repository Secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

# Build gate for FastBeat.
#
# WHY THIS EXISTS: PR #10 merged a `master` that did not compile -- the equalizer
# call sites landed without their implementation, because a `/app` rule in
# .gitignore had silently kept the two source files out of the repository.
# Nothing in the pipeline compiled the merge result, so nothing objected.
#
# This workflow is that missing objection. For it to actually block a bad merge
# it must also be marked a REQUIRED status check in the repository's branch
# protection rules for `master` -- a workflow file alone cannot enforce that.
name: Build

on:
  push:
    branches:
      - master
      - "feature/**"
      - "fix/**"
      - "refactor/**"
  # For pull_request, `branches` filters the BASE branch, not the head branch.
  # Only `master` is listed: a PR aimed at a feature branch is already covered
  # by the push trigger on that branch, so listing more here only duplicates runs.
  pull_request:
    branches:
      - master
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Assemble, lint, unit test
    runs-on: ubuntu-latest
    # 45, not 30: adding the release assemble put roughly four more minutes of R8 on the
    # critical path, and a cold Gradle cache on a busy runner already pushed the old budget.
    # The timeout exists to catch a hang, not to be the thing that fails a healthy run.
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history, not the default depth-1. app/build.gradle.kts derives
          # versionCode from `git rev-list --count HEAD` and versionName from
          # `git describe`; a shallow clone reports a count of 1 and finds no
          # tag, so every CI APK would silently carry the fallback version.
          fetch-depth: 0

      # Verify that the committed Gradle Wrapper JAR is genuine and has not been
      # tampered with. This is a supply-chain security best practice -- a malicious
      # wrapper JAR could execute arbitrary code during every build.
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      # JDK 17, not 21: the Gradle toolchain needs 17+, and AGP 9.0.0 with
      # Kotlin 2.2.10 is verified against 17 locally. Keep the two in step.
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      # `testDebugUnitTest`, not bare `test`: `test` would run the release unit-test
      # variant too, which is the same specs a second time. `useJUnitPlatform()` is
      # already configured, so Kotest specs run as-is.
      - name: Assemble, lint and unit test
        run: ./gradlew assembleDebug lint testDebugUnitTest --stacktrace

      # The release variant is built here because it is the ONLY variant that ships, and it was
      # previously the only one nothing ever built. `isMinifyEnabled` and `isShrinkResources` are
      # on for release alone, so R8 -- which can remove a class that only reflection reaches, and
      # produce an APK that compiles, installs and then crashes on launch -- ran for the first time
      # whenever someone happened to cut a release locally. That is the worst moment to discover it.
      #
      # It adds roughly four minutes to the run. That is the price of the release path being
      # continuously proven rather than assumed, and it is cheap next to shipping a broken APK.
      #
      # Without signing secrets configured the APK comes out UNSIGNED; the build says so and still
      # succeeds, which is what lets this step run unchanged on forks. See app/build.gradle.kts.
      - name: Assemble release (exercises R8)
        if: ${{ !cancelled() }}
        run: ./gradlew assembleRelease --stacktrace

      # Its own step, and `!cancelled()` so it reports even when the step above failed -- one run
      # then tells you about both compile/test failures and style regressions instead of hiding the
      # second behind the first. detekt is baselined (detekt-baseline.xml), so this only fails on
      # NEW violations; see the detekt {} block in app/build.gradle.kts.
      - name: Static analysis (detekt)
        if: ${{ !cancelled() }}
        run: ./gradlew detekt --stacktrace

      # Formatting gate. Baselined at app/config/ktlint/baseline.xml, so this only fails on
      # NEW violations. `ktlintCheck`, never `ktlintFormat` -- CI must report, not rewrite.
      - name: Formatting (ktlint)
        if: ${{ !cancelled() }}
        run: ./gradlew ktlintCheck --stacktrace

      # `if-no-files-found: error` is deliberate. `base { archivesName = "FastBeat" }`
      # in app/build.gradle.kts renames the output, so the stock `app-debug.apk`
      # path every template uses matches nothing here. Without this setting the
      # step would succeed while uploading an empty artifact -- a silent hole
      # exactly like the one that produced a non-compiling master.
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FastBeat-debug-apk
          path: app/build/outputs/apk/debug/FastBeat-debug.apk
          if-no-files-found: error
          retention-days: 14

      # The R8 mapping file is the only thing that can turn an obfuscated production stack trace
      # back into source lines, and it is NOT reproducible from a later build -- a rebuilt APK
      # generates a different mapping. Any release you distribute must be archived together with
      # the mapping produced by that exact build, so it is uploaded here rather than regenerated
      # on demand. proguard-rules.pro keeps SourceFile/LineNumberTable specifically so this file
      # has line numbers to decode.
      - name: Upload R8 mapping
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FastBeat-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      # Runs even when the build fails -- that is the case where the reports are
      # actually needed. `warn` rather than `error` because an early compile
      # failure legitimately produces no reports at all.
      - name: Upload lint and test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-and-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 7
